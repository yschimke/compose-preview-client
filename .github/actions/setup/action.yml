name: 'Setup JDK + Gradle'
description: >
  Install Temurin JDK 17 and configure gradle/actions/setup-gradle with the
  action versions pinned consistently across this repo.

inputs:
  cache-read-only:
    description: >
      Pass 'true' in release/publish jobs to prevent Gradle cache writes —
      avoids cache poisoning from untrusted PR runs reading those entries
      on subsequent workflow invocations. (zizmor: cache-poisoning)
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: 17.0.20+101
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
