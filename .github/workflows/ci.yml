name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ktfmt + core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: ktfmt
        run: ./gradlew ktfmtCheckAll --stacktrace
      - name: Core engine tests
        run: ./gradlew :core:test --stacktrace

  android:
    name: Assemble mobile + wear
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"
      - name: Assemble debug
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug --stacktrace
